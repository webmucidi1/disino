<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dişino</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#174c53;background:#dff7ef;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}#app{width:100%;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(ellipse at 50% 40%,#fff9db,transparent 65%),linear-gradient(135deg,#c9f4ec,#c9eaff);padding:clamp(8px,2vw,30px);gap:10px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(20px,3vw,48px);margin:0}button{background:white;border-radius:22px;padding:12px 20px;box-shadow:0 5px 0 #b3d8d4;font-weight:800}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:4px solid #7355bc}main{min-height:0;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px}.side{background:#ffffffb5;border-radius:28px;padding:18px;text-align:center;font-size:clamp(14px,1.7vw,26px)}.stage{height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.stage svg{width:100%;height:100%;min-height:0;max-height:100%;overflow:visible}.message{font-size:clamp(18px,2.5vw,38px);font-weight:900;text-align:center;min-height:1.5em}.foods{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(5px,1vw,18px);width:100%}.food{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:8px;min-height:64px;font-size:clamp(12px,1.5vw,24px)}.food span{font-size:clamp(30px,6vw,100px);line-height:1.1}.meter{height:20px;border-radius:30px;background:#d9e6e3;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:#49b98c;transition:width .4s}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{padding:9px 14px}.active{background:#ffe17d}.spark{animation:pop .55s ease both}@keyframes pop{50%{transform:scale(1.08)}}.plaque{fill:#e6b86b;opacity:.85}.brush{cursor:pointer;touch-action:none}.hidden{display:none!important}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side{display:none}.foods{grid-template-columns:repeat(3,1fr)}header{flex-wrap:wrap}header button{padding:8px}footer{flex-wrap:wrap}.nav button{font-size:12px}.food span{font-size:36px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#reward{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8dcf5;border-radius:32px;z-index:2;overflow:hidden;text-align:center;color:#80520b} .stage{position:relative} #reward .cup{font-size:clamp(70px,15vh,180px);animation:pop .8s ease 3} #reward strong{font-size:clamp(24px,4vw,60px)} .confetti{position:absolute;top:-20px;width:12px;height:20px;animation:fall 2.8s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(75vh) rotate(540deg)}} .dance{animation:dance .5s ease-in-out 6}@keyframes dance{50%{transform:rotate(5deg) translateY(-12px)}0%,100%{transform:rotate(-5deg)}} #reward .mini{font-size:clamp(32px,7vh,85px);animation:dance .5s ease-in-out 6} button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}#reward{background:transparent;justify-content:flex-start;pointer-events:none;overflow:visible;padding-top:0} #reward strong{background:#fff4bd;border-radius:20px;padding:6px 18px;box-shadow:0 4px 18px #e6ad3866;font-size:clamp(20px,3vw,44px)} #rewardStars{line-height:1} #face.golden #teeth rect{fill:url(#goldTooth);stroke:#b87509;animation:goldshine 1.1s ease-in-out 4;transform-box:fill-box;transform-origin:center} #face.golden #teeth g:nth-child(2n) rect{animation-delay:.15s} @keyframes goldshine{0%{fill:#fffdf5} 45%{filter:brightness(1.6) drop-shadow(0 0 7px #ffcf35);transform:scale(1.08)} 100%{fill:url(#goldTooth)}} @media(prefers-reduced-motion:reduce){#face.golden #teeth rect,.dance,.confetti{animation:none}} </style><div id="app"><header><h1>🦷 Dişino</h1><div class="nav"><button id="sound">🔊 Ses</button><button id="full">⛶ Tam ekran</button><button id="reset">↻ Yeni çocuk</button></div></header><main><aside class="side"><b>Diş dostu alışkanlıklar</b><div class="meter"><i id="meter"></i></div><div id="score"></div><div id="attempts" aria-live="polite" style="font-size:clamp(18px,2vw,32px);margin-top:12px"></div><p>⭐ <span id="stars">0</span></p></aside><section class="stage"><svg id="face" viewBox="0 0 500 350" role="img" aria-label="Dişino dinozor karakteri"><ellipse cx="250" cy="330" rx="150" ry="15" fill="#9dcfc0" opacity=".5"/><path d="M110 125 Q65 100 90 55 L140 85 170 25 210 65 260 15 300 65 350 35 375 100" fill="#f4b85e"/><rect x="90" y="65" width="320" height="255" rx="120" fill="#68c9a0" stroke="#329b80" stroke-width="5"/><ellipse cx="250" cy="190" rx="145" ry="105" fill="#92dfb7"/><ellipse cx="175" cy="130" rx="34" ry="43" fill="white"/><ellipse cx="325" cy="130" rx="34" ry="43" fill="white"/><circle cx="182" cy="138" r="15" fill="#23474b"/><circle cx="318" cy="138" r="15" fill="#23474b"/><circle cx="187" cy="132" r="5" fill="white"/><circle cx="323" cy="132" r="5" fill="white"/><ellipse cx="120" cy="188" rx="23" ry="12" fill="#f4a6a0"/><ellipse cx="380" cy="188" rx="23" ry="12" fill="#f4a6a0"/><path d="M130 205 Q250 230 370 205 Q365 310 250 310 Q135 310 130 205" fill="#713c50"/><ellipse cx="250" cy="287" rx="58" ry="18" fill="#f18da0"/><defs><linearGradient id="goldTooth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5a0"/><stop offset=".45" stop-color="#ffc62e"/><stop offset="1" stop-color="#b87509"/></linearGradient></defs><g id="teeth"></g></svg><div id="message" class="message" aria-live="polite">Haydi, bir yiyecek seç!</div><div id="reward" class="hidden" role="status"><strong>Altın Diş Ödülü!</strong><div id="rewardStars" style="font-size:clamp(24px,5vw,65px)"></div></div></section><aside class="side" id="hint">Dişino acıktı!<p>Bir yiyeceğe dokun.</p></aside></main><div><div id="foods" class="foods"></div><footer style="margin-top:12px"><div class="nav"><button id="feed" class="active">🍎 Beslenme</button><button id="clean">🪥 Fırçalama</button></div><button id="restart" hidden style="background:#238b62;color:white;font-size:clamp(20px,2.5vw,36px)">↻ Yeniden Başla</button><button id="repeat">▶ Dinle</button></footer></div></div><script>
const $=id=>document.getElementById(id);let health=70,stars=0,plaque=0,mode='feed',sound=true,busy=false,last='Haydi, bir yiyecek seç!',cleaned=new Set();const foods=[['🍎','Elma',1],['🍭','Lolipop',0],['🧀','Peynir',1],['🥤','Şekerli içecek',0],['💧','Su',1],['🥕','Havuç',1],['🍪','Bisküvi',0],['🥛','Sade süt',1],['🍫','Çikolata',0],['🥒','Salatalık',1],['🍐','Armut',1],['🍬','Şekerleme',0]];let round=0,attempts=5,turnTimer;let voices=[];function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}loadVoices();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',loadVoices);function speak(t,done){if(!sound||!('speechSynthesis'in window)){if(done)done();return;}let synth=speechSynthesis;synth.cancel();let u=new SpeechSynthesisUtterance(t.replace(/[✓⚠🏆]/gu,'').trim());let tr=voices.filter(v=>/^tr(?:[-_]|$)/i.test(v.lang));let rank=v=>(/natural|neural|premium|enhanced/i.test(v.name)?8:0)+(/emel|yelda|filiz|female/i.test(v.name)?4:0)+(/google|microsoft/i.test(v.name)?2:0);tr.sort((a,b)=>rank(b)-rank(a));if(tr.length)u.voice=tr[0];u.lang='tr-TR';u.rate=.92;u.pitch=1.16;u.volume=.9;if(done){u.onend=done;u.onerror=done;}synth.speak(u)}let audioCtx;function tone(ok){if(!sound)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let now=audioCtx.currentTime;let notes=ok?[523.25,659.25,783.99]:[392,293.66];notes.forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+i*.105;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.16)})}catch{}}let voiceTimer;function feedback(ok){clearTimeout(voiceTimer);if(window.speechSynthesis)speechSynthesis.cancel();tone(ok);voiceTimer=setTimeout(()=>speak(ok?'Sağlıklı':'Zararlı'),ok?390:280)}function msg(t){last=t;$('message').textContent=t;clearTimeout(voiceTimer);if(window.speechSynthesis)speechSynthesis.cancel()}function draw(){ $('attempts').textContent='Kalan hak: '+attempts+'/5 '+ '●'.repeat(attempts)+'○'.repeat(5-attempts); $('meter').style.width=health+'%';$('score').textContent=health+'/100';$('stars').textContent=stars;$('teeth').innerHTML=Array.from({length:10},(_,i)=>{let x=146+(i%5)*42,y=i<5?218:266;return `<g data-tooth="${i}" class="${mode==='clean'?'brush':''}" tabindex="${mode==='clean'?0:-1}" role="${mode==='clean'?'button':'img'}" aria-label="Diş ${i+1}"><rect x="${x}" y="${y}" width="38" height="34" rx="11" fill="#fffdf5" stroke="#d5e8df" stroke-width="2"/>${(i<plaque&&(mode!=='clean'||!cleaned.has(i)))?`<circle class="plaque" cx="${x+13}" cy="${y+13}" r="8"/><circle class="plaque" cx="${x+25}" cy="${y+21}" r="5"/>`:''}</g>`}).join('')}
function buttons(items,fn){$('foods').replaceChildren(...items.map((f,i)=>{let b=document.createElement('button');b.className='food';let s=document.createElement('span');s.textContent=f[0];b.append(s,document.createTextNode(f[1]));b.onclick=()=>fn(f,i);return b}))}function choose(f){if(busy||attempts===0)return;busy=true;attempts--;health=Math.max(0,Math.min(100,health+(f[2]?10:-10)));if(f[2]){stars++;msg('✓ Sağlıklı');feedback(true)}else{plaque=Math.min(10,plaque+2);msg('⚠ Zararlı');feedback(false)}draw();$('face').classList.remove('spark');void $('face').getBoundingClientRect();$('face').classList.add('spark');turnTimer=setTimeout(()=>{busy=false;if(mode==='feed'){round++;showFoods();if(!attempts)finishRound()}},attempts?1400:2100)}let resultTimer,session=0;function finishRound(){let current=session,ok=stars===5;let result=ok?'Tebrikler, sağlıklı dişler! Altın diş ödülünü kazandın.':'Dişler çürüdü! Haydi fırçalayalım!';msg(result);$('hint').textContent=stars+'/5 sağlıklı seçim';if(ok){$('foods').replaceChildren();$('rewardStars').textContent='⭐'.repeat(stars);$('reward').classList.remove('hidden');$('reward').querySelectorAll('.confetti').forEach(e=>e.remove());for(let i=0;i<40;i++){let c=document.createElement('i');c.className='confetti';c.style.left=(i*37%100)+'%';c.style.background=['#f7b72d','#ee779e','#58c7a2','#8a79df'][i%4];c.style.animationDelay=(i%9*.12)+'s';$('reward').append(c)}$('face').classList.add('dance');$('face').classList.add('golden');$('clean').disabled=true;$('restart').hidden=false;speak(result,()=>{if(current===session)tone(true)});return}busy=true;$('foods').replaceChildren();let advance=()=>{if(current!==session||mode!=='feed'||attempts!==0||!busy)return;clearTimeout(resultTimer);busy=false;setMode('clean')};resultTimer=setTimeout(advance,4500);speak(result,advance)}function showFoods(){if(!attempts){$('foods').replaceChildren();return}buttons(Array.from({length:6},(_,i)=>foods[(round*3+i)%foods.length]),choose)}function setMode(m){mode=m;$('clean').disabled=true;$('feed').disabled=true;for(let k of ['feed','clean'])$(k).classList.toggle('active',k===m);if(m==='feed'){showFoods();msg(attempts?'Haydi, bir yiyecek seç!':'Tur tamamlandı!');$('hint').textContent='Dişino acıktı! Bir yiyeceğe dokun.'}if(m==='clean'){cleaned.clear();buttons([['🪥','Dişlere dokun veya üzerinde gezdir']],()=>msg('Nazikçe fırçala!'));msg('Haydi, dişleri fırçalayalım!');$('hint').textContent='Dişlerin üzerinde parmağını gezdir.'}draw()}function brush(e){if(mode!=='clean')return;let g=e.target.closest('[data-tooth]');if(!g)return;let i=+g.dataset.tooth;if(i>=plaque||cleaned.has(i))return;cleaned.add(i);draw();if(cleaned.size===plaque){plaque=0;health=Math.min(100,health+20);draw();msg('Pırıl pırıl oldu dişler! Sen de en az 2 dakika fırçala!');speak('Pırıl pırıl oldu dişler! Sen de en az 2 dakika fırçala!');$('foods').replaceChildren();$('hint').textContent='Temizlik tamamlandı!';$('restart').hidden=false}}$('face').addEventListener('pointerdown',brush);$('face').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let el=document.elementFromPoint(e.clientX,e.clientY);if(el)brush({target:el})}});$('face').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();brush(e)}});$('face').style.touchAction='none';for(let m of ['feed','clean'])$(m).onclick=()=>{if(!busy && attempts===0 && stars<5 && m==='clean' && mode!=='clean')setMode(m)};$('repeat').onclick=()=>{if(last==='✓ Sağlıklı')feedback(true);else if(last==='⚠ Zararlı')feedback(false);else if(last==='Tebrikler, sağlıklı dişler! Altın diş ödülünü kazandın.'||last==='Pırıl pırıl oldu dişler! Sen de en az 2 dakika fırçala!')speak(last)};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Ses':'🔇 Sessiz';if(!sound){clearTimeout(voiceTimer);if(window.speechSynthesis)speechSynthesis.cancel();if(audioCtx)audioCtx.suspend()}};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{msg('Tam ekran desteklenmiyor. Tarayıcının tam ekran seçeneğini kullan.')}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'⛶ Tam ekrandan çık':'⛶ Tam ekran'});$('reset').onclick=()=>{ $('restart').hidden=true;session++;$('reward').classList.add('hidden');$('face').classList.remove('dance','golden');clearTimeout(resultTimer);clearTimeout(turnTimer);busy=false;attempts=5;health=70;stars=0;plaque=0;round=0;setMode('feed')};$('restart').onclick=()=> $('reset').click();setMode('feed');
</script></html>
